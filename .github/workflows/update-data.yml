name: Mise à jour automatique des données
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: DIAGNOSTIC temporaire - trouver le dataset des organes
        run: |
          for url in \
            "https://data.assemblee-nationale.fr/static/openData/repository/17/amo/organes/Organe.json.zip" \
            "https://data.assemblee-nationale.fr/static/openData/repository/17/amo/organes_divises/Organes.json.zip" \
            "https://data.assemblee-nationale.fr/static/openData/repository/17/amo/deputes_actifs_mandats_actifs_organes_divises/AMO10_deputes_actifs_mandats_actifs_organes_divises.json.zip" \
            "https://data.assemblee-nationale.fr/static/openData/repository/17/organe/Organe.json.zip" \
            "https://data.assemblee-nationale.fr/static/openData/repository/17/amo/organes_acteurs/Organes.json.zip" \
            "https://data.assemblee-nationale.fr/static/openData/repository/17/amo/liste_organe_acteur/Organe.json.zip" \
            ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$url")
            echo "$code  $url"
          done
          echo "--- listing repository/17/amo/ via index if possible ---"
          curl -s "https://data.assemblee-nationale.fr/static/openData/repository/17/amo/" | head -c 2000 || true
      - name: Récupérer les nouveaux scrutins de l'Assemblée nationale
        run: node scripts/fetch-scrutins.js
      - name: Récupérer les indicateurs INSEE
        run: node scripts/fetch-insee.js
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
        continue-on-error: true
      - name: Committer les changements s'il y en a
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement de données — rien à committer."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git push
          fi
