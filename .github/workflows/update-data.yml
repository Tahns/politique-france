name: Mise à jour automatique des données
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: DIAGNOSTIC temporaire - structure brute d'un scrutin
        run: |
          curl -sL -o /tmp/s.zip "https://data.assemblee-nationale.fr/static/openData/repository/17/loi/scrutins/Scrutins.json.zip"
          mkdir -p /tmp/s && unzip -q -o /tmp/s.zip -d /tmp/s
          F=$(find /tmp/s -name '*.json' -type f | sort | tail -1)
          echo "=== FICHIER: $F ==="
          cat "$F" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{console.log(JSON.stringify(JSON.parse(d), null, 2).slice(0, 6000))})"
      - name: Récupérer les nouveaux scrutins de l'Assemblée nationale
        run: node scripts/fetch-scrutins.js
      - name: Récupérer les indicateurs INSEE
        run: node scripts/fetch-insee.js
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
        continue-on-error: true
      - name: Committer les changements s'il y en a
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement de données — rien à committer."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git push
          fi
