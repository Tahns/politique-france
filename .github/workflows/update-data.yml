name: Mise à jour automatique des données
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: DIAGNOSTIC temporaire 2
        run: |
          set -x
          URL="https://data.assemblee-nationale.fr/static/openData/repository/17/amo/tous_acteurs_mandats_organes_xi_legislature/AMO30_tous_acteurs_tous_mandats_tous_organes_historique.json.zip"
          echo "--- Telechargement AMO30 (historique complet) ---"
          curl -s -o /tmp/amo30.zip -w "HTTP:%{http_code} SIZE:%{size_download}\n" "$URL"
          ls -la /tmp/amo30.zip
          mkdir -p /tmp/amo30
          unzip -q /tmp/amo30.zip -d /tmp/amo30
          echo "--- Arborescence (premier niveau) ---"
          find /tmp/amo30 -maxdepth 3 -type d
          echo "--- Recherche du fichier organe PO847173 ---"
          FOUND=$(find /tmp/amo30 -iname "PO847173.json" | head -1)
          echo "Fichier: $FOUND"
          if [ -n "$FOUND" ]; then
            cat "$FOUND"
          else
            echo "Toujours introuvable par nom de fichier, recherche par contenu..."
            grep -rl "PO847173" /tmp/amo30 | head -3
          fi
          echo "--- Nombre total de fichiers organe et de GP legislature 17 ---"
          node -e "
          const fs = require('fs');
          const path = require('path');
          function findDirNamed(base, name) {
            const entries = fs.readdirSync(base, { withFileTypes: true });
            for (const e of entries) {
              if (e.isDirectory()) {
                if (e.name === name) return path.join(base, e.name);
                const found = findDirNamed(path.join(base, e.name), name);
                if (found) return found;
              }
            }
            return null;
          }
          const dir = findDirNamed('/tmp/amo30', 'organe');
          console.log('dossier organe:', dir);
          if (dir) {
            const files = fs.readdirSync(dir);
            console.log('total fichiers organe:', files.length);
            let nbGP17 = 0;
            for (const f of files) {
              try {
                const raw = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf-8'));
                const o = raw.organe;
                if (o && o.codeType === 'GP' && o.legislature === '17') nbGP17++;
                if (o && o.uid === 'PO847173') {
                  console.log('PO847173 TROUVE:', JSON.stringify(o));
                }
              } catch (e) {}
            }
            console.log('GP legislature 17 trouves:', nbGP17);
          }
          "
      - name: Récupérer les nouveaux scrutins de l'Assemblée nationale
        run: node scripts/fetch-scrutins.js
      - name: Récupérer les indicateurs INSEE
        run: node scripts/fetch-insee.js
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
        continue-on-error: true
      - name: Committer les changements s'il y en a
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement de données — rien à committer."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git push
          fi
