name: Mise à jour automatique des données
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: DIAGNOSTIC temporaire - contenu complet du zip et catalogue
        run: |
          curl -sL -o /tmp/s.zip "https://data.assemblee-nationale.fr/static/openData/repository/17/loi/scrutins/Scrutins.json.zip"
          mkdir -p /tmp/s && unzip -q -o /tmp/s.zip -d /tmp/s
          echo "=== Arborescence complète (hors VTANR) ==="
          find /tmp/s -type f | grep -v 'VTANR' | head -50
          echo "=== Dossiers ==="
          find /tmp/s -type d
          echo "=== Total fichiers ==="
          find /tmp/s -type f | wc -l
          echo "=== Page catalogue AN (recherche liens organe/acteur) ==="
          curl -sL "https://data.assemblee-nationale.fr/acteurs/deputes-en-exercice" | grep -oE 'href="[^"]*\.zip"' | sort -u | head -30
          echo "=== Page catalogue AN generique ==="
          curl -sL "https://data.assemblee-nationale.fr/static/openData/repository/17/amo/deputes_actifs_mandats_actifs_organes_divises/" -o /dev/null -w "%{http_code}\n"
      - name: Récupérer les nouveaux scrutins de l'Assemblée nationale
        run: node scripts/fetch-scrutins.js
      - name: Récupérer les indicateurs INSEE
        run: node scripts/fetch-insee.js
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
        continue-on-error: true
      - name: Committer les changements s'il y en a
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement de données — rien à committer."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git push
          fi
