name: Mise à jour automatique des données
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: DIAGNOSTIC temporaire - structure du dataset organes AMO50
        run: |
          curl -sL -o /tmp/o.zip "https://data.assemblee-nationale.fr/static/openData/repository/17/amo/acteurs_mandats_organes_divises/AMO50_acteurs_mandats_organes_divises.json.zip"
          mkdir -p /tmp/o && unzip -q -o /tmp/o.zip -d /tmp/o
          echo "=== Dossiers de premier niveau ==="
          find /tmp/o -maxdepth 3 -type d
          echo "=== Comptage par dossier ==="
          find /tmp/o -type d -exec sh -c 'echo "{}: $(find "{}" -maxdepth 1 -name "*.json" | wc -l)"' \;
          echo "=== Exemple de fichier organe (recherche GP) ==="
          F=$(grep -rl '"codeType":"GP"' /tmp/o/json/organe/ 2>/dev/null | head -1)
          if [ -z "$F" ]; then F=$(find /tmp/o -ipath '*organe*' -name '*.json' | head -1); fi
          echo "FILE: $F"
          cat "$F" | head -c 3000
      - name: Récupérer les nouveaux scrutins de l'Assemblée nationale
        run: node scripts/fetch-scrutins.js
      - name: Récupérer les indicateurs INSEE
        run: node scripts/fetch-insee.js
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
        continue-on-error: true
      - name: Committer les changements s'il y en a
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement de données — rien à committer."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git push
          fi
